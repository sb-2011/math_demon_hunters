[project]
name = "math-demon-hunters"
version = "1.1.0"
description = "A subtraction practice game for kids with a neon demon-hunter theme."
requires-python = ">=3.10"

# No runtime dependencies on purpose: the app is built on the standard library
# so a fresh clone runs with `python3 play.py` and nothing else.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
mathhunters = "mathhunters.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mathhunters = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
