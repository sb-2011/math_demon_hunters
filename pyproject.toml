[project]
name = "math-demon-hunters"
version = "1.2.0"
description = "Two math practice games for kids: neon-themed subtraction, and Inuyasha-themed multiplication."
requires-python = ">=3.10"

# No runtime dependencies on purpose: the app is built on the standard library
# so a fresh clone runs with `python3 play.py` (or `play_multiplication.py`) and
# nothing else.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
mathhunters = "mathhunters.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mathhunters = ["web/*", "web/*/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
